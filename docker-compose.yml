version: "3.9"
services:
  db:
    image: postgres:16
    container_name: carelink_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: carelink
      POSTGRES_DB: carelink
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5450:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata: